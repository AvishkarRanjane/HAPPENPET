<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - HappenPet Store</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

<!-- ==============================
        NAVIGATION BAR
================================= -->
<header class="navbar">
    <div class="logo">HAPPENPET</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#featured">Featured</a>
        <a href="index.html#best">Best Sellers</a>
        <a href="index.html#trending">Trending</a>
        <a href="aboutus.html">About Us</a>
        <a href="login.html" style="color:#d4af37;">Login</a>
        <a href="cart.html" id="cart-btn">Cart (0)</a>
    </nav>
</header>

<!-- ==============================
        LOGIN PAGE CONTENT
================================= -->
<div class="login-page">
    <div class="login-container">
        <h1>Member Login</h1>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <input type="checkbox" id="remember" style="width:auto; margin-right:8px;">
                <label for="remember" style="display:inline; margin-bottom:0;">Remember me</label>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="signup-link">
            <p>Don't have an account? <a href="#signup">Create one now</a></p>
            <p><a href="#">Forgot your password?</a></p>
        </div>

        <hr style="border-color:#333; margin:30px 0;">

        <h2 style="font-size:20px; text-align:center; color:#d4af37; margin-bottom:20px;">Or Sign Up</h2>

        <form onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm password" required>
            </div>

            <div class="form-group">
                <input type="checkbox" required style="width:auto; margin-right:8px;">
                <label style="display:inline; margin-bottom:0;">I agree to Terms & Conditions</label>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>
    </div>
</div>

<!-- ==============================
        FOOTER
================================= -->
<footer>
    <p>© 2025 HappenPet Store. All Rights Reserved.</p>
</footer>

<script>
let cartCount = 0;

// Load cart count on page load
window.onload = () => {
    let savedCount = localStorage.getItem("cartCount");
    if (savedCount) {
        cartCount = parseInt(savedCount);
        document.getElementById("cart-btn").innerText = `Cart (${cartCount})`;
    }
};

function handleLogin(event) {
    event.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    
    if (email && password) {
        alert("Login successful! Welcome to HappenPet Store!");
        localStorage.setItem("userEmail", email);
        window.location.href = "index.html";
    }
}

function handleSignup(event) {
    event.preventDefault();
    const name = document.getElementById("signup-name").value;
    const email = document.getElementById("signup-email").value;
    const password = document.getElementById("signup-password").value;
    const confirmPassword = document.getElementById("confirm-password").value;
    
    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }
    
    if (name && email && password) {
        alert("Account created successfully! Welcome to HappenPet Store!");
        localStorage.setItem("userEmail", email);
        localStorage.setItem("userName", name);
        window.location.href = "index.html";
    }
}
</script>

</body>
</html>
